<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sistem Presensi Sekolah Multi-Tenant</title>
    <meta name="description" content="Aplikasi presensi sekolah multi-tenant berbasis Google Drive dan Google Sheets dengan login sekolah tanpa email, manajemen hak akses, presensi manual, barcode/RFID, izin kamar mandi, dan rekapitulasi data." />
    
    <!-- PWA Theme & Capability -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Presensi" />

    <!-- Apple iOS Safari PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Presensi" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Social Meta Tags -->
    <meta property="og:title" content="Sistem Presensi Sekolah Multi-Tenant" />
    <meta property="og:description" content="Aplikasi presensi sekolah multi-tenant berbasis Google Drive dan Google Sheets dengan login sekolah tanpa email, manajemen hak akses, presensi manual, barcode/RFID, izin kamar mandi, dan rekapitulasi data." />
    <!-- Error boundary for dev environment iframe proxy -->
    <script>
      window.addEventListener('error', function (e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason && String(e.reason).includes('WebSocket')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="overscroll-none antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
